name: Curated package and solver checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'PY'
          import glob, subprocess, sys
          wheel = glob.glob('dist/*.whl')
          assert len(wheel) == 1
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheel[0]+'[dev,transmission,plots]'])
          PY
          python -m pip check
      - name: Installed CLI and solver exports outside checkout
        run: |
          cp scripts/release_smoke.py "$RUNNER_TEMP/release_smoke.py"
          cd "$RUNNER_TEMP"
          feeder-agents --help
          python release_smoke.py --transmission
      - name: Curated regressions
        run: python -m pytest -q
      - name: Seven packaged examples
        run: python scripts/check_examples.py
