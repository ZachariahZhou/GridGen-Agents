research_question: 'selective: expanded design permissions; preserve original response
  baseline and all requested targets.'
base_spec:
  network_kind: distribution
  n_buses: 25
  voltage_kv: 10
  total_kw_min: 360
  total_kw_max: 360
  seed: 42
  scenario:
    kind: urban
    engineering_profile: urban
    layout: spatial_mst
  phase_design:
    mode: unbalanced
    single_phase_laterals: 0
    two_phase_laterals: 0
  repair_policy:
    strategy: none
probes:
- id: a
  kind: voltage_p
  step_mw: 0.01
  injection_buses:
  - b1
- id: b
  kind: voltage_p
  step_mw: 0.01
  injection_buses:
  - b9
targets:
- probe_id: a
  reference: baseline_ratio
  lower: 1.15
  upper: 1.35
- probe_id: b
  reference: baseline_ratio
  lower: 0.99
  upper: 1.01
search:
  allowed_actions:
  - replace_conductor
  - scale_layout
  - scale_subtree
  max_layout_scale_change: 0.75
  max_rounds: 4
  candidates_per_round: 16
  max_branch_length_change: 0.75
  max_node_displacement_km: 0.75
  max_joint_actions: 2
assumptions:
- Geometry permissions are research freedoms, not engineering standards.
- Preserve exact bus count, connectivity, demand and PV allocation, phases, voltage
  and source/control policy.
- Both response ratios refer to the original model.
